name: docseva_flutter
description: DocSeva - Government Service Assistant migration to Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  provider: ^6.1.1
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  intl: ^0.19.0
  file_picker: ^8.0.0
  syncfusion_flutter_pdfviewer: ^26.2.10
  path_provider: ^2.1.3
  open_file: ^3.3.2
  cached_network_image: ^3.3.1
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4
  cupertino_icons: ^1.0.6
  google_generative_ai: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
